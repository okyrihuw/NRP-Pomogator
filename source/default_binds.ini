; ############################################################################
; #                                                                          #
; #   ПОМОГАТОР v1.0 — биндер-буфер для админки GTA                          #
; #                                                                          #
; #   Бинд кладёт готовую команду в буфер обмена. Ты сам открываешь чат      #
; #   и жмёшь Ctrl+V. В игру программа не печатает и ничего не нажимает.      #
; #                                                                          #
; #   • Файл открывается обычным Блокнотом. Сохранять в кодировке UTF-8!     #
; #   • После правки перечитай конфиг из трея (правый клик по значку).       #
; #   • Комментарии — строки, начинающиеся с ";" или "#".                    #
; #   • Работают переменные {my_id}, {Пол} и вставка {space}:                #
; #     /get{space} -> в буфере "/get " с пробелом на конце.                  #
; #                                                                          #
; ############################################################################


; ==== НАСТРОЙКИ =============================================================
[settings]
nick = Ник нейм                  ; твой ник в шапке окошка с подсказками
rank = Хелпер                    ; твоё звание в шапке окошка
my_id = 00000                    ; твой игровой ID (в командах пиши {my_id})

; --- подтверждение копирования ----------------------------------------------
; подтверждение бинда: плашку и звук можно включать/выключать по отдельности
copy_toast = true                ; плашка «СКОПИРОВАНО В БУФЕР»: true — показывать, false — выключить
copy_beep = true                 ; звук при копировании: true — включён, false — выключить
copy_toast_ms = 1600             ; сколько плашку держать на экране, мс (если включена)
copy_no_history = true           ; не засорять историю Win+V (Windows 10/11)

; --- внешний вид окошка с подсказками ---------------------------------------
hint_font = Consolas             ; шрифт
hint_size = 14                   ; размер шрифта, пиксели (9-18)
hint_x = 10                      ; отступ окошка слева
hint_y = 300                     ; отступ окошка сверху
hint_alpha = 225                 ; прозрачность фона 0-255
hint_bg = 0A0A0A                 ; цвет фона (RRGGBB)
title_color = FFD75F             ; цвет заголовка
group_color = FF4D4D             ; цвет названий разделов
key_color = 7FD1FF               ; цвет названий клавиш
text_color = F2F2F2              ; цвет текста подсказок
hint_show_on_start = true        ; показать окошко при запуске
hint_start_hide_ms = 5000        ; через сколько мс его спрятать (0 — не прятать)
tray_notify_on_start = true      ; всплывающая подсказка от значка при запуске

; --- служебные клавиши ------------------------------------------------------
; Пустое значение = клавиша не назначена (всё это есть в меню трея).
toggle_hint = alt+p              ; показать / скрыть окошко с подсказками

; --- фильтр по активному окну ------------------------------------------------
; Пусто = бинды работают везде. Например: only_when_window = Multi Theft Auto
only_when_window =


; ==== ПЕРЕМЕННЫЕ ============================================================
[vars]
; Если ты девочка — поставь "а", если мальчик — оставь пусто.
; {Пол} в текстах превратит "полезен{Пол}" в "полезена".
Пол =


; ============================================================================
;  БИНДЫ
;  key   — клавиша (ctrl+1, alt+u, numpad7, ...)
;  group — заголовок раздела в окошке подсказок
;  hint  — что делает (видно в окошке)
;  send  — что попадёт в буфер обмена (со слэшем и без)
; ============================================================================

[bind]
key = numpad1
group = Репорты
hint = 1 — ещё есть вопросы к администрации?
send = Ещё имеются какие-либо вопросы к администрации? Я могу ещё чем-нибудь помочь вам? Если не будет ответа, к большому сожалению репорт мне придется закрыть в течении 1-й минуты.

[bind]
key = numpad2
group = Репорты
hint = 2 — есть фиксация — идите на форум
send = Если у вас есть фиксация на нарушения игрока, то Вы можете обратиться на форум. Я могу ещё чем-нибудь помочь вам? Если не будет ответа, к большому сожалению репорт мне придется закрыть в течении 1-й минуты.

[bind]
key = numpad3
group = Репорты
hint = 3 — ожидайте, я прослежу и вернусь с ответом
send = Ожидайте, я сейчас прослежу, а после вернусь к вам с ответом.

[bind]
key = numpad4
group = Репорты
hint = 4 — решено, могу помочь ещё чем-то?
send = Решено. Скажите пожалуйста, чем я могу ещё помочь вам? Если не будет ответа, к большому сожалению репорт мне придется закрыть в течении 1-й минуты.

[bind]
key = numpad5
group = Репорты
hint = 5 — нарушений не выявлено
send = Во время наблюдения, никаких нарушений не выявлено, могу я ещё чем-то помочь? Если не будет ответа, к большому сожалению репорт мне придется закрыть в течении 1-й минуты.

[bind]
key = numpad6
group = Репорты
hint = 6 — не видел полной ситуации
send = К сожалению, я не видел полной ситуации и не смогу выдать наказание.

[bind]
key = numpad7
group = Репорты
hint = 7 — админы не вмешиваются в РП процесс
send = Администрация не имеет права вмешиваться в РП процесс.

[bind]
key = numpad8
group = Репорты
hint = 8 — не согласны с наказанием — обжалование
send = Если вы не согласны с выданным наказанием, то Вы можете обжаловать мои действия.

[bind]
key = numpad9
group = Репорты
hint = 9 — благодарю за обращение
send = Благодарю вас за обращение, в случае вопросов, вы можете обратиться к нам.

[bind]
key = numpad0
group = Репорты
hint = 0 — прощание с игроком
send = Приятной игры на проекте NEXTRP

[bind]
key = alt+y
group = Репорты
hint = вам следует обратиться в тех. раздел
send = Вам следует обратится в тех.раздел, способы связи с ТП: Виджет на официальном сайте. Почта techsupport@nextrp.ru. - Telegram бот  t.me/nextmta_bot или @nextmta_bot

[bind]
key = alt+t
group = Репорты
hint = ЛТС/СТС не чиним (кроме бага)
send = К сожалению мы не чиним ЛТС / СТС. Исключение: Баг

[bind]
key = alt+numpad0
group = Репорты
hint = шаблон поздравления
send = С наступающим новым годом! Пусть в этом году у вас сбудутся все мечты, а жизнь радует новыми возможностями и приятными сюрпризами!

[bind]
key = ctrl+1
group = Команды
hint = Ctrl 1 — /adminmode (админ-мод)
send = /adminmode

[bind]
key = ctrl+2
